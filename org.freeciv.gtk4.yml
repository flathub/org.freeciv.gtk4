app-id: org.freeciv.gtk4
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: freeciv-gtk4
rename-icon: freeciv-client
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --filesystem=~/.freeciv:create
modules:
  - name: freeciv-gtk4
    buildsystem: meson
    no-autogen: true
    config-opts:
      - -Dclients=gtk4
      - -Dfcmp=gtk4
      - -Dtools=[]
      - -Daudio=sdl3
    sources:
      - type: archive
        url: "https://sourceforge.net/projects/freeciv/files/Freeciv 3.2/3.2.7/freeciv-3.2.7.tar.xz"
        sha256: 2720076d50f29db42cdc5e510e7c098f7793f7c0ac410fdf390a52bc57507917
      - type: patch
        path: 0001-Mark-flathub-as-the-distributor.patch
      - type: patch
        path: 0002-Rename-modpack-installer-icon.patch
